name: Build and test

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2.3.1
    - uses: cachix/install-nix-action@v12
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: Build
      run: nix-build -A blynn-compiler
    - name: Test
      run: echo "1427b0a5b47487bf23a42899601d2b86955554a59ba169c303063444ed709ba8 result/share/raw" | sha256sum -c
    - run: cp result/bin/vm vm && cp result/share/raw raw
    - name: Upload vm and raw
      uses: actions/upload-artifact@v2
      with:
        name: build result
        path: |
          raw
          vm
